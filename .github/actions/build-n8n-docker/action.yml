# Builds the n8n and runners CI test images (n8nio/n8n:ci-<variant>-<sha> +
# n8nio/runners:ci-<variant>-<sha>) and caches the tarball under a SHA-derived
# key so downstream jobs in the same workflow run can restore it via
# load-n8n-docker.
#
# The tag is per variant and SHA because self-hosted runners share the host's
# Docker daemon: a fixed tag like `:local` would let concurrent runs for
# different commits overwrite each other's image.
#
# It builds with the daemon's default builder (no buildx container), so layers
# stay cached on the host between jobs.
#
# Cache-aware: if the tarball for this SHA is already cached (e.g. a parent
# workflow ran prepare-docker earlier), the build step is skipped and this
# action becomes a no-op.

name: 'Build n8n CI Docker image'
description: 'Builds n8nio/n8n + n8nio/runners test images and publishes them as a SHA-keyed cache tarball for downstream shards.'

inputs:
  build-variant:
    description: 'standard or coverage. Coverage uses build:docker:coverage.'
    required: false
    default: 'standard'
  cache-sha:
    description: 'SHA for the image cache key and tag. Empty = github.sha.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Check cache for existing image
      id: cache-check
      uses: actions/cache/restore@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}
        path: /tmp/n8n-image.tar.zst
        lookup-only: true

    - name: Build Docker image
      if: steps.cache-check.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-nodejs
      with:
        build-command: ${{ inputs.build-variant == 'coverage' && 'pnpm build:docker:coverage' || 'pnpm build:docker' }}
      env:
        INCLUDE_TEST_CONTROLLER: 'true'
        IMAGE_TAG: ci-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}

    - name: Save image tarball
      if: steps.cache-check.outputs.cache-hit != 'true'
      shell: bash
      env:
        IMAGE_TAG: ci-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}
      run: |
        docker save "n8nio/n8n:$IMAGE_TAG" "n8nio/runners:$IMAGE_TAG" | zstd -T0 -3 -o /tmp/n8n-image.tar.zst
        ls -lh /tmp/n8n-image.tar.zst

    - name: Publish image tarball to cache
      if: steps.cache-check.outputs.cache-hit != 'true'
      uses: actions/cache/save@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}
        path: /tmp/n8n-image.tar.zst
