# Composite action for logging into GitHub Container Registry (this fork publishes to GHCR only).
# Centralizes the login pattern used across multiple Docker workflows.

name: 'Docker Registry Login'
description: 'Login to GitHub Container Registry'

inputs:
  login-ghcr:
    description: 'Login to GitHub Container Registry'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # The self-hosted runner image's own node is v18; scripts here target current Node.
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '24.18.1'

    - name: Login to GitHub Container Registry
      if: inputs.login-ghcr == 'true'
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
        GHCR_USER: ${{ github.actor }}
      run: |
        node .github/scripts/retry.mjs --attempts 3 --delay 10 \
          'echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin'
