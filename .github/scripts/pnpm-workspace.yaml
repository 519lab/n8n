# Makes .github/scripts its own workspace root (it is not a member of the repo
# workspace) and carries its pnpm settings; pnpm 11+ no longer reads the
# "pnpm" field in package.json. Install without --ignore-workspace, which
# would skip this file: `pnpm install --dir ./.github/scripts`.
overrides:
  brace-expansion@5: ^5.0.11
  fast-uri: ^3.1.7
  handlebars@4: 4.7.9
  jsonata: ^2.2.1
  tar: ^7.5.21
  undici@6: ^6.27.0
  undici@7: ^7.29.0
