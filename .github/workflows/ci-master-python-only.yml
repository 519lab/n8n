name: 'CI: Master (Python-only PRs)'

# ci-master.yml path-ignores the Python task runner, so a PR touching only that
# path never reports the ci-master checks the develop ruleset requires. This
# reports them as passing for Python-only PRs (the runner has its own CI).
# Job names fall back to a non-required name whenever anything else changed, so
# the real ci-master checks are never shadowed on mixed PRs.

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - packages/@n8n/task-runner-python/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Python-only change
    runs-on: ubuntu-latest
    outputs:
      python_only: ${{ steps.files.outputs.python_only }}
    steps:
      - name: Check changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          echo "$files"
          if [ -n "$files" ] && ! grep -qv '^packages/@n8n/task-runner-python/' <<<"$files"; then
            echo "python_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_only=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: ${{ needs.detect.outputs.python_only == 'true' && 'Lint / Lint' || 'Lint (python-only stub, n/a)' }}
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python-only change; covered by the task runner's own CI."

  unit-test:
    name: ${{ needs.detect.outputs.python_only == 'true' && format('Unit tests ({0}) / Unit tests', matrix.node-version) || format('Unit tests ({0}) (python-only stub, n/a)', matrix.node-version) }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.23.2, 24.18.1]
    steps:
      - run: echo "Python-only change; covered by the task runner's own CI."
