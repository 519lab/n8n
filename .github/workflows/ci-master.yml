name: 'CI: Master (Build, Test, Lint)'

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - packages/@n8n/task-runner-python/**
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - packages/@n8n/task-runner-python/**

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run on master/develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-github:
    name: Build for Github Cache
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
      QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
      QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs
        with:
          # The default is build without typechecking, we want both
          build-command: pnpm build

  unit-test:
    name: Unit tests
    uses: ./.github/workflows/test-unit-reusable.yml
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.18.1]
    with:
      ref: ${{ github.sha }}
      nodeVersion: ${{ matrix.node-version }}
      collectCoverage: ${{ matrix.node-version == '24.18.1' }}
    secrets: inherit

  lint:
    name: Lint
    uses: ./.github/workflows/test-linting-reusable.yml
    with:
      ref: ${{ github.sha }}

  notify-on-failure:
    name: Notify Slack on failure
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [unit-test, lint, build-github]
    # Only alert on push (master/develop). A failing PR is visible on the PR itself,
    # and github.ref_name is a merge ref (e.g. "39/merge") on pull_request events.
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          sparse-checkout: .github/scripts/slack
          sparse-checkout-cone-mode: false
      - name: Notify Slack
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel '#alerts-build' \
            --text '${{ github.ref_name }} branch (build or test or lint) failed (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
