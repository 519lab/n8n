name: 'CI: Master (Build, Test, Lint)'

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - packages/@n8n/task-runner-python/**
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - packages/@n8n/task-runner-python/**

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run on master/develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-github:
    name: Build for Github Cache
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs
        with:
          # The default is build without typechecking, we want both
          build-command: pnpm build

  unit-test:
    name: Unit tests
    uses: ./.github/workflows/test-unit-reusable.yml
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.18.1]
    with:
      ref: ${{ github.sha }}
      nodeVersion: ${{ matrix.node-version }}
      collectCoverage: ${{ matrix.node-version == '24.18.1' }}
    secrets: inherit

  lint:
    name: Lint
    uses: ./.github/workflows/test-linting-reusable.yml
    with:
      ref: ${{ github.sha }}
