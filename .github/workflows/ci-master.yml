name: 'CI: Master (Build, Test, Lint)'

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - packages/@n8n/task-runner-python/**
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - packages/@n8n/task-runner-python/**

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run on master/develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-github:
    name: Build for Github Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs
        with:
          # The default is build without typechecking, we want both
          build-command: pnpm build

  unit-test:
    name: Unit tests
    uses: ./.github/workflows/test-unit-reusable.yml
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.18.1]
    with:
      ref: ${{ github.sha }}
      nodeVersion: ${{ matrix.node-version }}
      collectCoverage: ${{ matrix.node-version == '24.18.1' }}
    secrets: inherit

  lint:
    name: Lint
    uses: ./.github/workflows/test-linting-reusable.yml
    with:
      ref: ${{ github.sha }}

  report-status:
    name: Report CI status
    needs: [build-github, unit-test, lint]
    # Branch pushes only: a failing PR is already visible on the PR.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/util-ci-failure-issue-reusable.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
