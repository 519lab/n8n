name: 'Util: Clean Stale Branches'
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Util: Clean Stale Branches (dry-run={0}, days={1}, exclude={2})', inputs['dry-run'], inputs.days, inputs.exclude) || '' }}"

on:
  schedule:
    - cron: '0 10 * * 1' # Every monday
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run only lists branches; uncheck to actually delete.'
        type: boolean
        default: true
      days:
        description: 'Days of inactivity before a branch is considered stale.'
        type: string
        default: '100'
      exclude:
        description: 'Extra comma-separated branch-name globs to keep (master and develop are always kept).'
        type: string
        default: ''

permissions:
  contents: write # delete branches; ruleset reads use the token's implicit metadata access
  pull-requests: read # list open PRs so their head/base branches are never deleted

jobs:
  remove-stale-branches:
    name: Remove stale branches
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup Node.js
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''
          install-command: pnpm install --frozen-lockfile --dir ./.github/scripts --ignore-workspace
          cache-dependency-path: .github/scripts/pnpm-lock.yaml

      - name: Clean stale branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STALE_DAYS: ${{ inputs.days || '100' }}
          # Long-lived branches. develop is also covered by the develop-ci-gate deletion
          # rule; master has no ruleset and only moves on promotion, so this keep-list is
          # what protects it. Always applied, even when a manual run passes extra globs.
          EXCLUDE_BRANCHES: ${{ inputs.exclude && format('master,develop,{0}', inputs.exclude) || 'master,develop' }}
        run: node .github/scripts/stale/clean-stale-branches.mjs --days="$STALE_DAYS" ${{ !inputs.dry-run && '--execute' || '--dry-run' }}

  report-status:
    name: Report CI status
    needs: [remove-stale-branches]
    # Scheduled runs only: a failing PR or manual run is already visible where it ran.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/util-ci-failure-issue-reusable.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
