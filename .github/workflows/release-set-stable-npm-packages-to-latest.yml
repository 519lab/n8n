name: 'Release: Set stable npm packages to latest'

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-github-releases:
    name: Promote current stable releases as latest
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          ref: refs/tags/stable
          fetch-depth: 1

      - name: Setup NodeJS
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''
          install-command: pnpm install --frozen-lockfile --dir ./.github/scripts --ignore-workspace
          cache-dependency-path: .github/scripts/pnpm-lock.yaml

      - name: Set npm packages to latest
        run: node ./.github/scripts/set-latest-for-monorepo-packages.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_DIST_TAG_AND_INITIAL_PUBLISH_TOKEN }}
