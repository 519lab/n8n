name: 'Test: E2E'

on:
  workflow_call:
    inputs:
      branch:
        description: 'GitHub branch to test.'
        required: false
        type: string
      test-mode:
        description: 'Test mode: local or docker-artifact'
        required: false
        default: 'local'
        type: string
      test-command:
        description: 'Test command to run'
        required: false
        default: 'pnpm --filter=n8n-playwright test:local'
        type: string
      workers:
        description: 'Number of parallel workers'
        required: false
        default: ''
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        default: 30
        type: number
      currents-project-id:
        description: 'Currents project ID for reporting'
        required: false
        default: 'nHHLA5'
        type: string
      pre-generated-matrix:
        description: 'Pre-generated shard matrix JSON. Defaults to 1 shard; multi-shard callers pass their own.'
        required: false
        default: '[{"shard":1,"images":""}]'
        type: string
      n8n-env:
        description: 'JSON string of n8n env vars to inject into test containers, e.g. {"N8N_EXPRESSION_ENGINE":"legacy"}'
        required: false
        default: ''
        type: string
      artifact-prefix:
        description: 'Prefix for uploaded shard artifacts'
        required: false
        default: 'e2e'
        type: string
      build-variant:
        description: 'Build variant for docker-artifact mode. Must match the variant used by prepare-docker (standard or coverage).'
        required: false
        default: 'standard'
        type: string

env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  PLAYWRIGHT_WORKERS: ${{ inputs.workers != '' && inputs.workers || '2' }}
  # Browser cache location - must match install-browsers script.
  # Absolute so nested pnpm invocations (e.g. coverage shard runner) don't
  # re-resolve a relative path against the package's INIT_CWD and double it.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packages/testing/playwright/.playwright-browsers
  # docker-artifact loads the image locally as n8nio/n8n:local; unused in local mode.
  TEST_IMAGE_N8N: 'n8nio/n8n:local'
  N8N_SKIP_LICENSES: 'true'
  CURRENTS_CI_BUILD_ID: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
  CURRENTS_PROJECT_ID: ${{ inputs.currents-project-id }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pre-generated-matrix) }}
    name: Shard ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup-nodejs

      - name: Install Browsers
        run: pnpm turbo run install-browsers --filter=n8n-playwright

      - name: Load n8n image from cache
        if: ${{ inputs.test-mode == 'docker-artifact' }}
        uses: ./.github/actions/load-n8n-docker
        with:
          build-variant: ${{ inputs.build-variant }}

      - name: Pre-pull Test Container Images
        if: ${{ !contains(inputs.test-command, 'test:local') }}
        run: pnpm --filter n8n-containers exec tsx pull-test-images.ts ${{ matrix.images }} || true

      - name: Resolve shard args
        id: shard-args
        env:
          MATRIX_SPECS: ${{ matrix.specs }}
          # toJSON distinguishes an orchestrated-but-empty spec list ("") from a
          # non-orchestrated matrix entry that never set `specs` (null). Only the
          # latter may fall back to Playwright's own --shard splitting; an empty
          # orchestrated list means "nothing to run", never "run everything".
          MATRIX_SPECS_JSON: ${{ toJSON(matrix.specs) }}
          SHARD: ${{ matrix.shard }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          if [ "$MATRIX_SPECS_JSON" = "null" ]; then
            echo "args=--shard=$SHARD/$JOB_TOTAL" >> "$GITHUB_OUTPUT"
          elif [ -z "$MATRIX_SPECS" ]; then
            echo "This shard's spec list is empty — nothing to run, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "args=$MATRIX_SPECS" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Tests
        if: steps.shard-args.outputs.skip != 'true'
        run: |
          # --pass-with-no-tests makes Playwright exit 0 when the selected specs
          # resolve to zero runnable tests. Covers the impact-map vs current-suite
          # skew window: a spec the committed coverage map points at may have been
          # quarantined (test.skip/fixme) since the map was built, or a capability
          # --grep on the test-command may filter every test on a shard. The
          # selector is doing the right thing; the run shouldn't treat "nothing
          # to run" as failure.
          # shellcheck disable=SC2086
          $TEST_COMMAND --workers="$WORKERS" $SHARD_ARGS --pass-with-no-tests
        env:
          # Protect args from template injections
          TEST_COMMAND: ${{ inputs.test-command }}
          # Uses pre-distributed specs if orchestration enabled, otherwise falls back to Playwright sharding
          WORKERS: ${{ env.PLAYWRIGHT_WORKERS }}
          SHARD_ARGS: ${{ steps.shard-args.outputs.args }}
          # Args for actual test command runner
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_TEST_ENV: ${{ inputs.n8n-env }}

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-shard-${{ matrix.shard }}
          path: |
            packages/testing/playwright/test-results/
            packages/testing/playwright/test-results.json
            packages/testing/playwright/playwright-report/
            packages/testing/playwright/coverage/lcov.info
            packages/testing/playwright/coverage/by-spec/
            packages/testing/playwright/coverage/index.html
            packages/testing/playwright/coverage/assets/
          retention-days: 1
          if-no-files-found: ignore

      - name: Cancel Currents run if workflow is cancelled
        if: ${{ cancelled() }}
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: |
          if [ -n "$CURRENTS_API_KEY" ]; then
            curl --location --request PUT \
              "https://api.currents.dev/v1/runs/cancel-ci/github" \
              --header "Authorization: Bearer $CURRENTS_API_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"githubRunId\": \"${{ github.run_id }}\", \"githubRunAttempt\": \"${{ github.run_attempt }}\"}"
          fi
