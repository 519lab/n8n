name: 'Test get-n8n.sh installer'

# Lints and end-to-end tests the get-n8n.sh install script (519lab images):
# fresh install boots the full stack, re-runs are no-ops, --upgrade only
# bumps N8N_VERSION, and all failure modes exit cleanly.
#
# Also runs nightly: the e2e pulls the rolling nightly n8n image and the
# sandbox images at :latest, so an image-side change can break installs
# without any change to the script itself.

on:
  pull_request:
    paths:
      - 'docker/get-n8n.sh'
      - 'docker/get-n8n-compose.yml'
      - 'docker/test-get-n8n.sh'
      - '.github/workflows/test-get-n8n.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-get-n8n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Lint (shellcheck + POSIX)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck docker/get-n8n.sh docker/test-get-n8n.sh
      - name: POSIX syntax check (dash)
        run: dash -n docker/get-n8n.sh && dash -n docker/test-get-n8n.sh

  e2e:
    name: 'Install, boot, upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The 519lab/n8n and runners GHCR packages are private.
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run test harness
        # Publish n8n on a free high port instead of 5678, so the test can't collide
        # with anything already listening there.
        run: |
          N8N_HOST_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          export N8N_HOST_PORT
          sh docker/test-get-n8n.sh --e2e

  report-status:
    name: Report CI status
    needs: [lint, e2e]
    # Scheduled runs only: a failing PR or manual run is already visible where it ran.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/util-ci-failure-issue-reusable.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
