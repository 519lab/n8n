name: 'Test: Linting'

on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to lint.
        required: false
        type: string
        default: ''
      nodeVersion:
        description: Version of node to use.
        required: false
        type: string
        default: 24.18.1

env:
  # Sized for the self-hosted runners (2 CPUs, 6 GB per job): one eslint process
  # at a time, with most of the job's memory as its heap.
  NODE_OPTIONS: --max-old-space-size=5120
  TURBO_CONCURRENCY: 1

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, skynet]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Build and Test
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm lint:ci
          node-version: ${{ inputs.nodeVersion }}
