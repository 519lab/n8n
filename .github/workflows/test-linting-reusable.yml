name: 'Test: Linting'

on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to lint.
        required: false
        type: string
        default: ''
      nodeVersion:
        description: Version of node to use.
        required: false
        type: string
        default: 24.18.1

env:
  # Tuned for the 4-vCPU / 16 GB GitHub-hosted runner: ~10 parallel eslint processes.
  NODE_OPTIONS: --max-old-space-size=7168
  TURBO_CONCURRENCY: 10

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''
          node-version: ${{ inputs.nodeVersion }}

      # TEMPORARY diagnostic: log memory use every 5s while lint runs.
      - name: Lint
        run: |
          (while sleep 5; do
            free -m | awk '/Mem:/{printf "[mem] used=%sMB avail=%sMB\n", $3, $7} /Swap:/{printf "[swap] used=%sMB\n", $3}'
          done) &
          pnpm lint:ci --summarize
