name: 'Test: Linting'

on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to lint.
        required: false
        type: string
        default: ''
      nodeVersion:
        description: Version of node to use.
        required: false
        type: string
        default: 24.18.1

env:
  # The 16 GB GitHub-hosted runner ran out of memory at 10 parallel eslint
  # processes (15.5 GB used, swap full) and was down to 1.1 GB free at 3.
  # Two at a time peaked at 10.3 GB (uncached, 16 min).
  NODE_OPTIONS: --max-old-space-size=5120
  TURBO_CONCURRENCY: 2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Build and Test
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm lint:ci
          node-version: ${{ inputs.nodeVersion }}
