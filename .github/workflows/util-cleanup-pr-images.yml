name: 'Util: Cleanup CI Docker Images'

on:
  schedule:
    # Daily cleanup at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  cleanup:
    name: 'Delete stale CI images'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Delete stale CI images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ORG: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
        run: node .github/scripts/cleanup-ghcr-images.mjs --stale 3

  report-status:
    name: Report CI status
    needs: [cleanup]
    # Scheduled runs only: a failing PR or manual run is already visible where it ran.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/util-ci-failure-issue-reusable.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
