name: 'Util: Cleanup CI Docker Images'

on:
  schedule:
    # Daily cleanup at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  cleanup:
    name: 'Delete stale CI images'
    runs-on: [self-hosted, skynet]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # The self-hosted runner image's own node is v18; scripts here target current Node.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.18.1'

      - name: Delete stale CI images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ORG: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
        run: node .github/scripts/cleanup-ghcr-images.mjs --stale 3

      # E2E images are tagged per commit (n8nio/{n8n,runners}:ci-<variant>-<sha>) on the
      # self-hosted runners' shared host Docker daemon, which this job also uses. Untag
      # this repo's ones older than 3 days; images still in use are skipped, and
      # nothing else on the daemon is touched.
      - name: Delete stale local CI images
        run: |
          cutoff=$(date -d '3 days ago' +%s)
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            --filter 'reference=n8nio/n8n:ci-*' --filter 'reference=n8nio/runners:ci-*' |
            sort -u | while read -r ref; do
              created=$(docker image inspect --format '{{.Created}}' "$ref") || continue
              if [ "$(date -d "$created" +%s)" -lt "$cutoff" ]; then
                docker image rm "$ref" >/dev/null && echo "Removed $ref" ||
                  echo "::warning::Could not remove $ref (still in use?)"
              fi
            done

  report-status:
    name: Report CI status
    needs: [cleanup]
    # Scheduled runs only: a failing PR or manual run is already visible where it ran.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/util-ci-failure-issue-reusable.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
